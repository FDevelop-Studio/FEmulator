name: FDevelop's Emulator CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  validate-and-build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@4
        
      - name: Setup Java Development Kit 17
        uses: actions/setup-java@4
        with: 
          java-version: '17'
          distribution: 'temurin'