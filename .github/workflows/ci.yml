name: FDevelop's Emulator CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configuration-cache=true"
  CMAKE_BUILD_TYPE: "Release"
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

jobs:
  validate-and-build:
    name: Build
    runs-on: ubuntu-latest

    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.7

      - name: Setup Java Environment (Temurin 21 LTS)
        uses: actions/setup-java@v4.2.2
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Initialize CMake Engine
        uses: lukka/get-cmake@v3.29.3

      - name: Setup Android Studio SDK Tools
        uses: android-actions/setup-android@v3.2.1

      - name: Execute Unified Production Build
        run: |
          chmod +x gradlew
          ./gradlew assemble

      - name: Verify Code Layout Architecture
        run: |
          ./gradlew checkStyle